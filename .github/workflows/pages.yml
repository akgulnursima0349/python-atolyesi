# Siteyi her main güncellemesinde derleyip GitHub Pages'e yayınlar.
# Defterlerin tarayıcı sürümü (JupyterLite + Pyodide) de derlenir ve yayından önce gerçek bir tarayıcıda baştan sona çalıştırılır.
name: Siteyi yayınla
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
        working-directory: site
      - run: npx vite build
        working-directory: site

      # --- Tarayıcı defterleri ---
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: lite/requirements.txt }
      - uses: actions/cache@v4
        with:
          path: lite/.onbellek/pyodide
          key: pyodide-${{ hashFiles('lite/derle.py') }}
      - run: pip install -r lite/requirements.txt
      - run: python lite/derle.py --cikti site/dist/defter
      - name: Defterleri tarayıcıda baştan sona çalıştır
        run: |
          npm i --no-save --prefix /tmp/pw playwright@1.49.1
          npx --prefix /tmp/pw playwright install --with-deps chromium
          (cd site/dist && python -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          mkdir -p /tmp/ekran
          NODE_PATH=/tmp/pw/node_modules EKRAN=/tmp/ekran node lite/test_defter.cjs http://localhost:8000/defter $(python lite/beklenen.py)
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: defter-ekranlari, path: /tmp/ekran, if-no-files-found: ignore }

      - uses: actions/upload-pages-artifact@v3
        with: { path: site/dist }
      - id: deploy
        uses: actions/deploy-pages@v4
